name: Validate Headroom
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  domain-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run security:check
      - run: npm run audit:verified
      - run: npm run typecheck
      - run: npm test
      - run: npm run export:android
        env:
          CI: '1'
          EXPO_OFFLINE: '1'
